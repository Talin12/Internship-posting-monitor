name: poll-job-boards

# Runs 4×/hour, plus a manual "Run workflow" button.
#
# Cron minutes are deliberately OFF the top/half hour. GitHub Actions runs every
# repo's schedule on shared infrastructure and, under load, silently drops runs
# queued at popular minutes (:00, :15, :30, :45). Odd offsets (:07/:22/:37/:52)
# are far less contended, so more of these actually fire — and polling 4×/hour
# means a dropped run is at most a ~15-min gap, not the 12-hour gap we saw on
# "*/30". Scheduled runs are still best-effort and can be delayed several minutes.
#
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity, but
# every run commits an updated seen.json (last_run changes), which keeps the repo
# active and the schedule alive.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Allow the job to push the updated seen.json back to the repo.
permissions:
  contents: write

concurrency:
  group: poll-job-boards
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Resume matching. ANTHROPIC_API_KEY drives the active Claude matcher;
          # if it's unset the monitor falls back to notifying every new posting.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- seen.json; then
            echo "seen.json unchanged; nothing to commit."
            exit 0
          fi
          git add seen.json
          git commit -m "chore: update seen.json [skip ci]"
          git push
