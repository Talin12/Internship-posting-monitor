# Companies to monitor and the filters applied to their postings.
#
# Each company needs a `platform` (greenhouse | lever | ashby) and the ATS
# `token` for that platform. See the README for how to find a company's token.
# The tokens below were verified live against each ATS during development.

companies:
  - name: Stripe
    platform: greenhouse
    token: stripe
  - name: Coinbase
    platform: greenhouse
    token: coinbase
  - name: Databricks
    platform: greenhouse
    token: databricks
  - name: Palantir
    platform: lever
    token: palantir
  - name: Ramp
    platform: ashby
    token: ramp
  - name: Notion
    platform: ashby
    token: notion

# Filtering is applied to every posting before it is diffed against seen state.
# A posting must pass BOTH the title rules and the location rules to notify.
filters:
  # Title must contain at least one of these substrings (case-insensitive).
  title_include: ["intern", "internship", "co-op", "new grad"]
  # ...and must contain none of these.
  title_exclude: ["senior", "staff", "principal", "manager", "director"]
  # Location must contain at least one of these. Empty list = match any location.
  location_include: []
  # ...and must contain none of these.
  location_exclude: []

# Resume matching (optional second stage). After keyword filtering and diffing,
# each genuinely-new posting's description is scored for semantic relevance to
# your resume; only postings scoring >= `threshold` are sent to Telegram.
#
# Uses the free Hugging Face sentence-similarity API (no LLM, no per-token cost).
# Needs HF_API_TOKEN in the environment and a resume (resume.txt / RESUME_TEXT).
# If either is missing, matching turns off and ALL new postings are notified.
matching:
  enabled: true
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2
  threshold: 0.30        # cosine similarity 0-1; raise to be pickier, lower for more
  max_to_score: 20       # cap postings scored per run (cost/rate-limit guard)
