# Companies to monitor and the filters applied to their postings.
#
# Each company needs a `platform` (greenhouse | lever | ashby) and the ATS
# `token` for that platform. See the README for how to find a company's token.
# The tokens below were verified live against each ATS during development.

companies:
  - name: Stripe
    platform: greenhouse
    token: stripe
  - name: Coinbase
    platform: greenhouse
    token: coinbase
  - name: Databricks
    platform: greenhouse
    token: databricks
  - name: Palantir
    platform: lever
    token: palantir
  - name: Ramp
    platform: ashby
    token: ramp
  - name: Notion
    platform: ashby
    token: notion

# Filtering is applied to every posting before it is diffed against seen state.
# A posting must pass BOTH the title rules and the location rules to notify.
filters:
  # Title must contain at least one of these (whole-word, case-insensitive).
  # Internships only — "new grad"/"new graduate" are full-time and intentionally
  # NOT included (and are excluded below to drop hybrid "Intern / New Grad" posts).
  title_include: ["intern", "internship", "co-op"]
  # ...and must contain none of these. Tuned for a software-engineering /
  # backend / full-stack profile: drops seniority plus non-software roles
  # (product, research/PhD, hardware, and non-tech functions) that otherwise
  # slip through as "... Intern". Data roles are intentionally NOT excluded.
  title_exclude:
    - "new grad"          # full-time; drops "SWE, New Grad" and "Intern / New Grad"
    - "new graduate"
    - "full-time"
    - "full time"
    - senior
    - staff
    - principal
    - manager          # also catches "Product Manager", "Program Manager"
    - director
    - lead
    - "product management"
    - "product marketing"
    - "research scientist"
    - phd
    - hardware
    - mechanical
    - electrical
    - firmware
    - marketing
    - sales
    - recruiting
    - recruiter
    - legal
    - counsel
    - accountant
    - designer
    - "product design"
    - clinical
    - "go-to-market"
    - "account executive"
  # Location must contain at least one of these. Empty list = match any location.
  location_include: []
  # ...and must contain none of these.
  location_exclude: []

# Resume matching (optional second stage) — currently DISABLED.
#
# When enabled, each new posting's description is scored for semantic relevance
# to your resume via the free Hugging Face sentence-similarity API, and only
# postings scoring >= `threshold` are sent to Telegram. In testing, the free
# embedding model was too coarse to reliably rank software roles after keyword
# filtering (it ranked Product Manager above Software Engineer), so matching is
# off and targeting is handled by the sharpened title filters above.
#
# To re-enable the hybrid: set enabled: true, provide HF_API_TOKEN + a resume
# (resume.txt / RESUME_TEXT), and calibrate `threshold` with `--dry-run` (which
# prints per-posting scores). See the README "Résumé matching" section.
matching:
  enabled: false
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2
  threshold: 0.30        # cosine similarity 0-1; raise to be pickier, lower for more
  max_to_score: 20       # cap postings scored per run (cost/rate-limit guard)
